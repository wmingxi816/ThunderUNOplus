<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>雷霆UNOplus</title>
    <style>
      #portrait-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: none;
        padding: 1.5rem;
        background: #000;
        color: #fff;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="portrait-overlay" data-testid="portrait-overlay" aria-hidden="true">
      <div class="portrait-copy">
        <p class="portrait-text-main">请旋转设备</p>
        <p class="portrait-text-sub">请使用横屏模式继续游戏</p>
        <p class="portrait-text-tip">
          手机请用<span class="portrait-text-tip-emphasis">浏览器</span>打开<span class="portrait-text-tip-emphasis">电脑/桌面</span>模式并旋转屏幕至<span class="portrait-text-tip-emphasis">横屏</span>
        </p>
        <p class="portrait-text-tip">手机端可以在右上角设置处调整为合适的缩放</p>
      </div>
      <img src="/turn-clockwise.webp" alt="" class="portrait-spin-icon" />
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
